<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Áudio to WAV</title>
  <meta name="description" content="Converte seu áudio para WAV, pronto para o Resolume. Roda no navegador, sem upload.">
  <meta name="theme-color" content="#1c2420">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="app">
    <header class="brand">
      <img src="icon.png" alt="" class="brand-icon" width="48" height="48">
      <div class="brand-copy">
        <p class="brand-kicker">by Luan</p>
        <h1>Áudio to WAV</h1>
        <p class="brand-sub">Converte seu áudio para usar no Resolume</p>
      </div>
    </header>

    <div id="loader-panel" class="loader-panel">
      <div class="loader-ring" aria-hidden="true"></div>
      <p id="loader-text">Carregando conversor…</p>
      <p class="loader-hint">Aguarde, preparando o conversor.</p>
    </div>

    <main id="main-panel" class="main-panel hidden">
      <section id="drop-zone" class="drop-zone" tabindex="0" role="button" aria-label="Área para arrastar arquivos de áudio">
        <span class="drop-glyph" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <path d="M20 8v18M20 26l-6-6M20 26l6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M8 30h24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </span>
        <p id="central-text" class="central-text">Arraste o áudio aqui</p>
        <p class="drop-hint">ou toque para selecionar · Qualquer formato de áudio</p>
        <input type="file" id="file-input" multiple hidden>
      </section>

      <section id="queue-panel" class="queue-panel hidden">
        <p class="queue-title">Na fila</p>
        <ul id="queue-list" class="queue-list" role="listbox" aria-label="Fila de arquivos"></ul>
        <div class="queue-actions">
          <button type="button" id="btn-remove" class="btn btn-secondary">Remover</button>
          <button type="button" id="btn-convert" class="btn btn-primary">Converter</button>
        </div>
      </section>

      <section id="progress-panel" class="progress-panel hidden">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="progress-text" class="progress-text"></p>
      </section>
    </main>

    <footer class="app-footer">
      <span>Conversão no seu aparelho</span>
      <span class="dot" aria-hidden="true">·</span>
      <span>sem upload</span>
    </footer>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
